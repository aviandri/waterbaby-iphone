name: MilkBaby
options:
  bundleIdPrefix: com.aviandri
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MilkBaby:
    type: application
    platform: iOS
    sources: [MilkBaby]
    info:
      path: MilkBaby/Info.plist
      properties:
        CFBundleDisplayName: MilkBaby
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Light
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aviandri.milkbaby
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
  MilkBabyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MilkBabyTests]
    dependencies:
      - target: MilkBaby
