name: MilkBaby
options:
  bundleIdPrefix: com.aviandri
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  projectFormat: xcode15_3
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MilkBaby:
    type: application
    platform: iOS
    sources: [MilkBaby]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aviandri.milkbaby
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MilkBaby
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
  MilkBabyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MilkBabyTests]
    dependencies:
      - target: MilkBaby
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.aviandri.milkbaby.tests
